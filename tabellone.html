<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corsa Cristiana — Tabellone</title>
  <link rel="stylesheet" href="css/tabellone.css">
</head>
<body>

  <div id="vista-lobby">
    <h1>Corsa Cristiana</h1>
    <div id="codice-partita-contenitore">
      Codice partita: <span id="codice-partita"></span>
    </div>
    <h2>Giocatori entrati: <span id="conteggio-lobby">0</span></h2>
    <ul id="lista-lobby"></ul>
    <button id="btn-inizia-partita" disabled>Inizia partita</button>
  </div>

  <div id="vista-gioco" class="nascosta">
    <div id="scena">
      <div id="tabellone"></div>

      <div id="pannello-sospeso" class="pannello-laterale">
        <div class="pannello-titolo">In sospeso</div>
        <div id="prove-in-sospeso"></div>
      </div>

      <div id="pannello-legenda" class="pannello-laterale">
        <div class="pannello-titolo">Legenda</div>
        <div id="legenda-lista"></div>
      </div>

      <div id="pannello-turno" class="pannello-laterale">
        <div class="pannello-titolo">Turno</div>
        <div id="turno-info"></div>
      </div>
    </div>

    <div id="carta-overlay" class="carta-overlay nascosta">
      <div id="carta" class="carta">
        <div class="carta-retro">?</div>
        <div class="carta-fronte">
          <div id="carta-tipo" class="carta-tipo"></div>
          <div id="carta-testo" class="carta-testo"></div>
          <div id="carta-riferimento" class="carta-riferimento"></div>
          <div id="carta-bottoni" class="carta-bottoni"></div>
        </div>
      </div>
    </div>

    <div id="risposta-area" class="pannello-flottante nascosta"></div>
    <div id="verdetto-area" class="pannello-flottante nascosta"></div>

    <div id="dado-overlay" class="dado-overlay nascosta">
      <div id="dado-faccia" class="dado-faccia">⚀</div>
    </div>
  </div>

  <script type="module" src="js/tabellone-ui.js"></script>
</body>
</html>
