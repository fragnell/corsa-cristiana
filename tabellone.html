<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Corsa Cristiana — Tabellone</title>
  <link rel="stylesheet" href="css/tabellone.css">
</head>
<body>
  <h1>Corsa Cristiana</h1>

  <div id="tabellone"></div>

  <div id="controlli">
    <div id="turno-info"></div>
  </div>

  <div id="carta-overlay" class="carta-overlay nascosta">
    <div id="carta" class="carta">
      <div class="carta-retro">?</div>
      <div class="carta-fronte">
        <div id="carta-tipo" class="carta-tipo"></div>
        <div id="carta-testo" class="carta-testo"></div>
        <div id="carta-riferimento" class="carta-riferimento"></div>
        <div id="carta-bottoni" class="carta-bottoni"></div>
      </div>
    </div>
  </div>

  <div id="risposta-area" class="pannello-flottante nascosta"></div>
  <div id="verdetto-area" class="pannello-flottante nascosta"></div>

  <div id="turno-giocatore-area" class="pannello-flottante nascosta"></div>

  <div id="dado-overlay" class="dado-overlay nascosta">
    <div id="dado-faccia" class="dado-faccia">⚀</div>
  </div>

  <script type="module" src="js/tabellone-ui.js"></script>
</body>
</html>
